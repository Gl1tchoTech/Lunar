name: Lunar
options:
  bundleIdPrefix: com.gl1tchotech
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Lunar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lunar/Sources
      - path: Lunar/Resources
    info:
      path: Lunar/Resources/Info.plist
      properties:
        CFBundleDisplayName: Lunar
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Lunar uses audio APIs for local playback only.
        NSAppleMusicUsageDescription: Lunar may link to your Apple Music library if granted access.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gl1tchotech.lunar
        PRODUCT_NAME: Lunar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO

  LunarTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/LunarTests
    dependencies:
      - target: Lunar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gl1tchotech.lunar.tests
        GENERATE_INFOPLIST_FILE: YES

  LunarSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/LunarSnapshotTests
    dependencies:
      - target: Lunar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gl1tchotech.lunar.snapshot
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lunar:
    build:
      targets:
        Lunar: all
        LunarTests: [test]
        LunarSnapshotTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: LunarTests
        - name: LunarSnapshotTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
