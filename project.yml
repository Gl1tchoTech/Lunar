name: Lunar
options:
  # We intentionally do NOT set `xcodeVersion` here, because it does
  # NOT control the pbxproj `objectVersion` in XcodeGen ≥ 2.42 — it
  # only sets `LastUpgradeCheck` in the archive object. The actual
  # `objectVersion` is emitted by the underlying XcodeProj library,
  # which defaults to the host Xcode's current format (77 on Xcode 16,
  # omitting `compatibilityVersion` entirely).
  #
  # The deterministic, runner-agnostic workaround lives in
  # `.github/workflows/build-ipa.yml` step "Patch pbxproj for Xcode
  # 15.4 backwards compatibility", which overwrites the
  # `objectVersion` + `compatibilityVersion` header lines AFTER
  # `xcodegen generate` runs. See yonaskolb/XcodeGen#1578 and
  # CocoaPods/CocoaPods#12583 for the maintainer-recommended approach.
  #
  # `xcodeVersion` is intentionally left unset so future maintainers
  # do not fall into the same trap I did at 3448447 / 0c13b2f.
  bundleIdPrefix: com.gl1tchotech
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
    ENABLE_BITCODE: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Lunar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lunar/Sources
      - path: Lunar/Resources
    info:
      path: Lunar/Resources/Info.plist
      properties:
        CFBundleDisplayName: Lunar
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Lunar uses audio APIs for local playback only.
        NSAppleMusicUsageDescription: Lunar may link to your Apple Music library if granted access.
        # Tier 6 — Other Apps handoff. Register Lunar as an alternate
        # "Open In..." target for any audio file. LSHandlerRank: Alternate
        # means Files / VLC / Shortcuts offer us after the default opener
        # (Apple Music), preserving Apple's own integration first.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - public.aiff-audio
              - public.aac-audio
              - id3
              - com.microsoft.waveform-audio
        # Tier 6 — Defensive types for FLAC + Ogg Vorbis. Without these,
        # third-party apps that don't already declare `org.xiph.flac` or
        # `org.vorbis` may not route audio through "Open In..." Lunar.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.xiph.flac
            UTTypeDescription: FLAC Audio
            UTTypeConformsTo:
              - public.audio
            UTTypeTagSpecification:
              public.filename-extension:
                - flac
              public.mime-type:
                - audio/flac
                - audio/x-flac
          - UTTypeIdentifier: org.vorbis
            UTTypeDescription: Ogg Vorbis Audio
            UTTypeConformsTo:
              - public.audio
            UTTypeTagSpecification:
              public.filename-extension:
                - ogg
                - oga
              public.mime-type:
                - audio/ogg
                - audio/vorbis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gl1tchotech.lunar
        PRODUCT_NAME: Lunar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO


schemes:
  Lunar:
    build:
      targets:
        Lunar: all
        LunarTests: [test]
        LunarSnapshotTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: LunarTests
        - name: LunarSnapshotTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

schemes:
  Lunar:
    build:
      targets:
        Lunar: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
