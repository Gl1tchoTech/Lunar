name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'Lunar/**'
      - 'project.yml'
      - 'Tests/**'
      - 'Scripts/**'

concurrency:
  group: lunar-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 45

    env:
      SCHEME: Lunar
      CONFIG: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        # Canonical action: sets DEVELOPER_DIR, validates the Xcode is
        # actually installed at /Applications/Xcode_15.4.app, fails loudly
        # if not, and surfaces the resolved version via steps.xcode.outputs.
        # Replaces the previous raw bash + `xcode-select` step which
        # silently no-op'd when the runner image migrated to a newer
        # default Xcode (causing XcodeGen to emit pbxproj objectVersion =
        # 77 — opaque to Xcode 15.4).
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Verify Xcode + Swift toolchain
        # Logs the resolved toolchain into the GHA log right after the
        # selector, so the next regression tells us which Xcode was
        # actually used instead of having to dig through xcodebuild
        # stderr.
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Install & pin XcodeGen
        # HOMEBREW_NO_AUTO_UPDATE=1 freezes the formula version (no
        # silent upgrade between GH Actions runs). `brew pin xcodegen`
        # then locks it from any future `brew upgrade` accidental
        # retry. Together this guarantees the same XcodeGen binary is
        # used on every run, so our project.yml
        # `options.xcodeVersion: "14.0"` always maps deterministically
        # to a known pbxproj objectVersion.
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          else
            echo "XcodeGen already present; honouring any existing brew pin."
          fi
          # `brew pin` succeeds the first time and is a no-op if already
          # pinned, so this is safe on every run.
          brew pin xcodegen || true
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Patch pbxproj for Xcode 15.4 backwards compatibility
        # Why this exists (the upstream truth, learned the hard way):
        #
        # XcodeGen's `options.xcodeVersion` key does NOT control the
        # pbxproj `objectVersion` line — it only sets
        # `LastUpgradeCheck`. The actual `objectVersion` is emitted by
        # the underlying XcodeProj library, which since XcodeGen 2.42+
        # defaults to the host Xcode's current format (`objectVersion =
        # 77` on Xcode 16, with NO `compatibilityVersion` line at
        # all). Xcode 15.4 (the SideStore workflow minimum per
        # docs/BUILD.md) refuses to open that with:
        #   "The project 'Lunar' cannot be opened because it is in a
        #    future Xcode project file format (77)."
        #
        # The XcodeGen maintainers' acknowledged workaround, cited in
        # yonaskolb/XcodeGen#1578 + CocoaPods/CocoaPods#12583 and
        # recommended directly in CocoaPods, is to overwrite the
        # format header lines AFTER `xcodegen generate` runs. The
        # patch is idempotent: `objectVersion` and
        # `compatibilityVersion` each appear exactly once in a pbxproj
        # archive, and the patch harmlessly no-ops on every other byte.
        run: |
          set -euo pipefail
          PBX=Lunar.xcodeproj/project.pbxproj
          if [ ! -f "$PBX" ]; then
            echo "::error::$PBX not found for patching."
            exit 1
          fi
          perl -pi -e 's/objectVersion\s*=\s*\d+;/objectVersion = 56;/' "$PBX"
          if grep -q 'compatibilityVersion' "$PBX"; then
            perl -pi -e 's/compatibilityVersion\s*=\s*"[^"]+";/compatibilityVersion = "Xcode 14.0";/' "$PBX"
          else
            # Insert a new compatibilityVersion line directly under
            # objectVersion, with the same leading-tab indent.
            perl -pi -e 's/(objectVersion = 56;)/$1\n\tcompatibilityVersion = "Xcode 14.0";/' "$PBX"
          fi
          echo "--- post-patch pbxproj format header ---"
          grep -nE 'objectVersion|compatibilityVersion' "$PBX" || true

      - name: Verify generated project format (fail-fast)
        # Reads the (post-patched) Lunar.xcodeproj/project.pbxproj,
        # prints the actual objectVersion + compatibilityVersion, and
        # EXITS NON-ZERO if either drifts away from the third-party
        # compatibility floor (Xcode 14.0 / objectVersion 56).
        #
        # If this fails, the answer is almost always one of:
        #   1. The perl patch above regressed — re-read it.
        #   2. XcodeGen / XcodeProj started emitting `objectVersion`
        #      in a new pattern (e.g. with whitespace) the perl
        #      regex doesn't match — extend the regex.
        #   3. The selected Xcode itself can no longer downgrade to
        #      56 — switch the runner image or update to a newer
        #      SideStore-supported minimum.
        run: |
          set -euo pipefail
          PBX=Lunar.xcodeproj/project.pbxproj
          if [ ! -f "$PBX" ]; then
            echo "::error::Generated $PBX not found."
            exit 1
          fi
          echo "--- pbxproj format diagnostics ---"
          grep -nE 'objectVersion|compatibilityVersion' "$PBX" || true
          # Symmetric extraction: first grep pulls the full
          # `foo = bar;` line, second stage strips everything but
          # the literal value, so what the comparison sees is just
          # `56` or `"Xcode 14.0"` — exactly the literal the
          # EXPECTED_* variables hold. Asymmetric extraction here
          # (only a single grep stage on COMPAT) was the false-
          # positive bug fixed in this commit: the diagnostic
          # printed `got compatibilityVersion = "Xcode 14.0"` but
          # compared it against `expected "Xcode 14.0"`, tripping
          # on a 19-character prefix mismatch even though the
          # values were identical.
          OBJ=$(grep -oE 'objectVersion\s*=\s*[0-9]+' "$PBX" | head -1 | grep -oE '[0-9]+' || true)
          COMPAT=$(grep -oE 'compatibilityVersion\s*=\s*"[^"]+"' "$PBX" | head -1 | grep -oE '"[^"]+"' || true)
          echo "  objectVersion          = ${OBJ:-MISSING}"
          echo "  compatibilityVersion   = ${COMPAT:-MISSING}"
          EXPECTED_OBJ=56
          EXPECTED_COMPAT='"Xcode 14.0"'
          FAIL=0
          if [ "${OBJ:-}" != "$EXPECTED_OBJ" ]; then
            echo "::error::objectVersion mismatch: expected ${EXPECTED_OBJ}, got ${OBJ:-MISSING}"
            FAIL=1
          fi
          if [ "${COMPAT:-}" != "$EXPECTED_COMPAT" ]; then
            echo "::error::compatibilityVersion mismatch: expected ${EXPECTED_COMPAT}, got ${COMPAT:-MISSING}"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::pbxproj format drift. Verify (1) the \"Patch pbxproj for Xcode 15.4 backwards compatibility\" step ran, (2) the perl regex still matches the XcodeProj library's current output, (3) the selected Xcode supports SwiftData + iOS 17 targets."
            exit 1
          fi
          echo "  -> OK (matches third-party Xcode 14.0 compatibility floor)"

      - name: Run unit + snapshot tests (Debug on iPhone 15 simulator)
        # We deliberately do NOT pipe to xcpretty here: a non-zero exit from
        # xcodebuild must fail the job. xcpretty is not pre-installed on
        # macos-14 runners and using `|| true` would silently mask failures.
        run: |
          set -o pipefail
          xcodebuild \
            -project Lunar.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Build app (Release, generic iOS, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Lunar.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package as unsigned IPA
        run: bash Scripts/build-ipa.sh "$CONFIG"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lunar-unsigned-ipa
          path: build/Lunar.ipa
          if-no-files-found: error
          retention-days: 30
